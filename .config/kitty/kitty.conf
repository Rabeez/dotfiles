# vim:fileencoding=utf-8:foldmethod=marker
#
# Kitty config — herdr-managed. No multiplexer bindings here; herdr owns
# tabs, splits, panes, and workspaces.

# Theme
include themes/catppuccin-mocha.conf

# Font
font_family Maple Mono NF Medium
font_size 16
adjust_line_height 110%

# Window
#
# Transparency is intentional and matches the Ghostty profile. herdr paints its
# sidebar with an explicit background (theme.custom.sidebar_bg), and kitty only
# applies background_opacity to the *default* background -- explicitly colored
# cells stay opaque. So the sidebar reads as a solid panel while the terminal
# area behind the panes stays translucent.
background_opacity 0.8
background_blur 20
hide_window_decorations titlebar-only
remember_window_size no
initial_window_width 10000
initial_window_height 10000
confirm_os_window_close 0
mouse_hide_wait -1
window_padding_width 0
placement_strategy center

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Shell
shell /bin/zsh --login
shell_integration enabled

# Bell
enable_audio_bell no

# macOS
macos_option_as_alt left

# Tab bar — hidden unless there is more than one tab
tab_bar_style powerline
tab_powerline_style round
tab_bar_edge top
tab_bar_min_tabs 2

# Keymaps
#
# herdr owns all multiplexing. These cmd+* bindings only translate macOS-native
# chords into herdr prefix sequences (prefix is ctrl+a = \x01), mirroring what
# the Ghostty config does for tmux via `keybind = cmd+t=text:\x01c`.
#
# These also deliberately override kitty's own built-in cmd+t / cmd+w /
# cmd+1..9 defaults, which is the equivalent of Ghostty's `=unbind` lines.
#
# ctrl+hjkl and alt+hjkl are intentionally left unbound so they reach herdr,
# where the herdr-splits plugin routes them to Neovim or to pane focus.

map cmd+t send_text all \x01c
map cmd+w send_text all \x01x
map cmd+z send_text all \x01z
map cmd+l send_text all \x01L
map cmd+1 send_text all \x011
map cmd+2 send_text all \x012
map cmd+3 send_text all \x013
map cmd+4 send_text all \x014
map cmd+5 send_text all \x015
map cmd+shift+t send_text all \x01T
